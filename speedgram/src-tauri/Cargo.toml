[package]
name = "speedgram"
version = "0.1.0"
description = "A fast, local-first Instagram desktop client"
authors = ["SpeedGram contributors"]
edition = "2021"

[lib]
name = "speedgram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4.1"
rand = "0.9"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-stronghold = "2.3"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.scrypt]
opt-level = 3
